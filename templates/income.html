{% extends "base.html" %}

{% block title %}إضافة دخل{% endblock %}

{% block content %}

<div class="form-box">

    <h1>💰 إضافة دخل</h1>

    <form method="POST" class="form">

        <label>المبلغ</label>

        <input
            type="number"
            name="amount"
            step="0.01"
            min="0.01"
            required
        >

        <label>الوصف</label>

        <input
            type="text"
            name="description"
            placeholder="مثال: مرتب"
            required
        >

        <button class="btn income-btn" type="submit">
            إضافة الدخل
        </button>

    </form>

</div>

{% endblock %}
